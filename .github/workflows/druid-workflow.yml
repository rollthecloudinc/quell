name: Druid
on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        required: true
        type: string
    secrets:
      RTC_GITHUB_REGISTRY:
        required: true
      ENVIRONMENT_NAME:
        required: true
      SSH_DEPLOY_KEY:
        required: true
      DESTINATION_REPO:
        required: true
      DESTINATION_USER:
        required: false
      TARGET_BRANCH:
        required: true
      OBJECTS_REPO:
        required: true
      ENABLE_GZIP:
        required: false
jobs:
  dev-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v3
        name: Checkout Site
      - run: echo ${{ secrets.OBJECTS_REPO }}
        name: Print Objects Repo
      - uses: actions/checkout@v3
        name: Checkout Objects
        with:
          repository: ${{ secrets.OBJECTS_REPO }}
          ref: ${{ secrets.TARGET_BRANCH }}
          path: "projects/spear/src/assets/objects"
          set-safe-directory: false
      - name: Delete Objects Git Directory
        run: rm -Rf projects/spear/src/assets/objects/.git
      - run: echo "::set-output name=objects::$(ls projects/spear/src/assets/objects/panelpage/*.json | jq -R -s -c 'split("\n")[:-1]')"
        name: Parse JSON object files
        id: jsonobjects
      - run: echo ${{ steps.jsonobjects.outputs.objects }}
        name: Print json objects
      - run: echo -e "export const panelpages = [" > projects/spear/src/data/panelpages.ts
        name: Create panelpages.ts
      - run: awk 'FNR==1 && NR!=1 {print ","}{print}' $(echo '${{ steps.jsonobjects.outputs.objects }}' | jq -c 'join(" ")' | rev | cut -c2-100000 | rev | cut -c2-100000 )  >> projects/spear/src/data/panelpages.ts
        name: Write panel page objects
      - run: echo '];' >> projects/spear/src/data/panelpages.ts
        name: End panelpages.ts
      - run: cp projects/spear/src/data/panelpages.ts projects/spear/src/assets/objects/panelpages.ts
        name: Copy panelpages.ts to assets for reference/debugging
      - uses: actions/setup-node@v3
        name: Setup Node
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
      - run: npm i gzipper -g
        name: Install gzipper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RTC_GITHUB_REGISTRY }}
      - name: 💥 Aggressive Clean Install to Apply Overrides
        run: |
          # 1. Clear file system of old dependencies and lock files
          echo "--- Cleaning node_modules and lock file ---"
          rm -rf node_modules
          #rm package-lock.json 
          
          # 2. CRITICAL: Clear the NPM cache on the runner
          echo "--- Forcing NPM cache clean ---"
          #npm cache clean --force

          # 3. Reinstall packages with --force (Applies all overrides)
          echo "--- Running npm install to apply overrides ---"
          npm install
          
          # 4. Final safety measure: Force module flattening
          #echo "--- Running npm dedupe as final check ---"
          #npm dedupe --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RTC_GITHUB_REGISTRY }}
      - name: Extract SCSS from panelpages
        run: |
          mkdir -p projects/spear/src/panelpage-styles

          for file in projects/spear/src/assets/objects/panelpage/*.json; do
            id=$(jq -r '.id' "$file")
            path=$(jq -r '.path // ""' "$file")
            scss=$(jq -r '.scss // ""' "$file")

            if [ "$scss" != "" ]; then
              safe_path=$(echo "$path" | sed 's/\//__/g')
              outfile="projects/spear/src/panelpage-styles/panelpage-${id}.scss"

              {
                echo "/* AUTO-GENERATED: PanelPage ${id} */"
                echo ""
                echo "[data-panelpage=\"${safe_path}\"] .panel-page {"
                echo "$scss"
                echo "}"
              } > "$outfile"

              echo "Wrote SCSS for $id → $outfile"
            fi
          done
      - name: Create master import SCSS file
        run: |
          MASTER="projects/spear/src/panelpage-styles/panelpage-dynamic-styles.scss"
          echo "// Auto-generated master SCSS file" > "$MASTER"
          echo "" >> "$MASTER"

          for p in projects/spear/src/panelpage-styles/panelpage-*.scss; do
            if [[ "$p" == *"panelpage-dynamic-styles.scss" ]]; then
              continue
            fi
            filename=$(basename "$p")
            echo "@forward './${filename}';" >> "$MASTER"
          done

          echo "Generated $MASTER"
      - run: npm run get-routes
      - run: npm run extract-routes
      - run: npm run prerender:${{ secrets.ENVIRONMENT_NAME }}
      - run: echo "::set-output name=stamp::$(date +'%Y%m%d%H%M%S')"
        name: Generate Release Stamp
        id: release
      - name: Push to build repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: 'dist/spear/browser'
          destination-github-username: ${{ secrets.DESTINATION_USER || 'rollthecloudinc' }}
          destination-repository-name: ${{ secrets.DESTINATION_REPO }}
          target-branch: ${{ secrets.TARGET_BRANCH }}