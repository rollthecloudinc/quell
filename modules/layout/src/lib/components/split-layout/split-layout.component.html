<div class="layout-wrapper">
  <div #mainControls [hidden]="!displayMainControls" class="main-controls">
    <ng-container *ngTemplateOutlet="extraActionsTmpl"></ng-container>
  </div>

  <div class="layout-inner">

    <div
      class="rows-wrapper"
      *ngFor="let _ of arrayFromNumber(totalRows); let i = index"
    >
      <div class="row-controls">
        <button mat-button type="button" [matMenuTriggerFor]="rowActions">
          <mat-icon>menu</mat-icon>
        </button>

        <mat-menu #rowActions="matMenu">
          <button mat-menu-item type="button" (mousedown)="addColumn(i)">Add Column</button>
          <button mat-menu-item type="button" (mousedown)="layoutSettings('row', i)">Layout Settings</button>
          <button mat-menu-item type="button" class="remove-row" (mousedown)="removeRow(i)">Delete</button>
        </mat-menu>
      </div>

      <div class="rows-inner">
        <as-split *ngIf="dashboard?.length > 0" unit="percent" direction="horizontal" (dragEnd)="dragEnd(i, $event)">
          
          <as-split-area
            *ngFor="let __ of arrayFromNumber(totalColumns(i)); let j = index"
            [size]="sizes[i][j]"
          >
            <div>

              <div #itemHeader [hidden]="!displayItemHeader" class="grid-item-header">
                <ng-container
                  *ngTemplateOutlet="gridItemActionsTmpl; context: { i: itemIndex(i,j) }"
                ></ng-container>
              </div>

              <div class="grid-item-inner">
                <ng-container
                  *ngTemplateOutlet="innerGridItemTmpl; context: { i: itemIndex(i,j) }"
                ></ng-container>
              </div>

            </div>
          </as-split-area>

        </as-split>
      </div>

    </div>

  </div>
</div>
