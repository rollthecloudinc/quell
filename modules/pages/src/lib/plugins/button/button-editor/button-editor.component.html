<form [formGroup]="contentForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>

    <div>
        <mat-form-field>
            <mat-label>Button Text</mat-label>
            <input matInput formControlName="text">
        </mat-form-field>
    </div>

    <div>
        <mat-form-field>
            <mat-label>Action (CSS class)</mat-label>
            <input matInput formControlName="action">
        </mat-form-field>
    </div>

    <div>
        <mat-form-field>
            <mat-label>Appearance</mat-label>
            <mat-select formControlName="appearance">
                <mat-option value="text">Text</mat-option>
                <mat-option value="elevated">Elevated</mat-option>
                <mat-option value="outlined">Outlined</mat-option>
                <mat-option value="filled">Filled</mat-option>
                <mat-option value="tonal">Tonal</mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <druid-params-querystring
        formControlName="params"
        [settings]="paramSettings"
        [contexts]="contexts">
    </druid-params-querystring>

  </mat-dialog-content>
  <mat-dialog-actions>
    <button type="submit" mat-raised-button color="primary" [disabled]="!contentForm.valid">Save</button>
    <button type="button" matButton="outlined" (click)="fill()">Fill in the form</button>
    <button type="submit" matButton="outlined" [disabled]="!contentForm.valid">Save the Form</button>
  </mat-dialog-actions>
</form>
