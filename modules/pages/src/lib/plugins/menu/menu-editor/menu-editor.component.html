<form [formGroup]="contentForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>

    <div>
      <mat-form-field>
        <mat-label>Icon Name</mat-label>
        <input matInput formControlName="iconName">
      </mat-form-field>
    </div>

    <div>
      <mat-form-field>
        <mat-label>Aria Label</mat-label>
        <input matInput formControlName="label">
      </mat-form-field>
    </div>

    <h3>Menu Items</h3>

    <div formArrayName="items">
      <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i">

        <mat-form-field>
          <mat-label>Item Icon Name</mat-label>
          <input matInput formControlName="iconName">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Item Text</mat-label>
          <input matInput formControlName="text">
        </mat-form-field>

        <mat-form-field>
            <mat-label>Item Action (CSS class)</mat-label>
            <input matInput formControlName="action">
        </mat-form-field>

        <button mat-icon-button color="warn" (click)="removeItem(i)">
          <mat-icon>delete</mat-icon>
        </button>

      </div>
    </div>

    <button mat-stroked-button (click)="addItem()" type="button">Add Item</button>

  </mat-dialog-content>
  <mat-dialog-actions>
    <button type="submit" mat-raised-button color="primary" [disabled]="!contentForm.valid">
      Save
    </button>
  </mat-dialog-actions>
</form>
