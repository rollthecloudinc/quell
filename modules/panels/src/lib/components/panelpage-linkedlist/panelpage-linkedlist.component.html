<div [formGroup]="formGroup">

  <mat-form-field>
    <mat-select formControlName="panelPage">
      <mat-option *ngFor="let p of (panelPages$ | async); let i = index" [value]="i">
        panel page | level: {{ i }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-select formControlName="panel">
      <mat-option *ngFor="let p of (panels$ | async); let i = index" [value]="i">
        panel | {{ i }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-select formControlName="pane">
      <mat-option *ngFor="let p of (panes$ | async); let i = index" [value]="i">
        pane | {{ i }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <druid-panels-panelpage-linkedlist
    *ngIf="(nested$ | async)?.length"
    formControlName="nested"
    [panelPages]="nested$ | async">
  </druid-panels-panelpage-linkedlist>

</div>
